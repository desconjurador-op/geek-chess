  bulk=(id,sel)=>'<div class="bk">AJUSTAR TODOS'+(sel||'')+'<input type="number" min="1" max="99" value="1" class="bn"><button data-sec="'+id+'" data-d="1">+ TODOS</button><button class="alt" data-sec="'+id+'" data-d="-1">− TODOS</button></div>',
  sec=(id,t,body,sel)=>'<div id="sec-'+id+'" class="sc"><h3>'+t+'</h3>'+body+bulk(id,sel)+'</div>';
 let h='<label class="rw">NOME DA SALA<input type="text" id="rname" maxlength="16" value="'+esc(RN)+'" style="width:180px;text-align:left"></label>';
 h+='<div class="sc"><h3>VISIBILIDADE DA SALA</h3><div class="rbt"><button class="mb'+(CFG.isPrivate?' alt':'')+'" data-priv="0">PÚBLICA</button><button class="mb'+(CFG.isPrivate?'':' alt')+'" data-priv="1">PRIVADA</button></div>'+(CFG.isPrivate?'<label class="rw" style="margin-top:6px">SENHA DA SALA<input type="text" id="rpass" maxlength="12" value="'+esc(CFG.password)+'" style="width:140px;text-align:left"></label>':'')+'</div>';
 h+='<div class="sc"><h3>MODO DE JOGO</h3><div class="rbt"><button class="mb'+(CFG.mode=='dano'?' alt':'')+'" data-mode="classico">REGRAS CLÁSSICAS</button><button class="mb'+(CFG.mode=='dano'?'':' alt')+'" data-mode="dano">REGRAS DE DANO</button></div><p class="hint">'+(CFG.mode=='dano'?'Capturar causa dano conforme a peça. O atacante só ocupa a casa se o alvo cair. Sem xeque-mate: vence quem zerar o HP do Rei.':'Capturar elimina a peça na hora. Xeque, xeque-mate e afogamento valem.')+'</p></div>';
 h+=sec('aura','AURA','<div class="rg">'+cell('AURA INICIAL','aura.start',0,30,CFG.aura.start)+cell('AURA MÁXIMA','aura.max',1,30,CFG.aura.max)+cell('GANHO POR TURNO','aura.gain',0,10,CFG.aura.gain)+'</div>');
 h+=sec('hp','VIDA DAS PEÇAS','<div class="rg">'+Object.keys(CFG.hp).map(k=>cell(NAMES[k].toUpperCase(),'hp.'+k,1,99,CFG.hp[k])).join('')+'</div>');
 if(CFG.mode=='dano')h+=sec('cap','DANO DE CAPTURA','<div class="rg">'+Object.keys(CFG.cap).map(k=>cell(NAMES[k].toUpperCase(),'cap.'+k,1,99,CFG.cap[k])).join('')+'</div>');
 h+=sec('tech','PODERES','<div class="rt"><span></span><span class="hd">ALC</span><span class="hd">DANO</span><span class="hd">AURA</span>'
  +Object.keys(TECH).map(k=>{const t=CFG.tech[k];return '<span style="color:'+TECH[k].col+'">'+TECH[k].n+'</span>'+inp('tech.'+k+'.r',1,8,t.r)+(DEF.tech[k].d>0?inp('tech.'+k+'.d',1,99,t.d):na)+inp('tech.'+k+'.c',0,20,t.c)}).join('')+'</div>',
  ' <select class="bs"><option value="r">ALCANCE</option><option value="d">DANO</option><option value="c">AURA</option></select>');
 h+=sec('eq','EQUIPÁVEIS (CUSTO DE AURA)','<div class="rg">'+Object.keys(EQUIP).map(k=>cell('<b style="color:'+EQUIP[k].col+';font-weight:400">'+EQUIP[k].n+'</b>','eq.'+k,0,20,CFG.eq[k])).join('')+'</div>');
 h+='<p class="hint">Poderes com custo maior que a AURA MÁXIMA ficam bloqueados.</p>';
 $('rm').innerHTML=h}
const setCfg=(p,v)=>{const[a,b,c]=p.split('.');if(c)CFG[a][b][c]=v;else CFG[a][b]=v},getCfg=p=>{const[a,b,c]=p.split('.');return c?CFG[a][b][c]:CFG[a][b]};
$('rm').oninput=e=>{const i=e.target,p=i.dataset.p;if(i.id==='rpass')CFG.password=i.value;else if(p&&i.value!=='')setCfg(p,Math.max(+i.min,Math.min(+i.max,Math.round(+i.value))))};
$('rm').onclick=e=>{
  const pr=e.target.closest('button[data-priv]');
  if(pr){const n=$('rname');if(n)RN=n.value;CFG.isPrivate=+pr.dataset.priv;buildRoom();return}
  const pv=e.target.closest('button[data-pvp]');if(pv){const n=$('rname');if(n)RN=n.value;CFG.pvp=+pv.dataset.pvp;buildRoom();return}const md=e.target.closest('button[data-mode]');if(md){const n=$('rname');if(n)RN=n.value;CFG.mode=md.dataset.mode;buildRoom();return}const b=e.target.closest('button[data-sec]');if(!b)return;const sc=$('sec-'+b.dataset.sec),n=Math.max(1,Math.round(+sc.querySelector('.bn').value)||1),st=sc.querySelector('.bs');
 sc.querySelectorAll('input[data-p]').forEach(i=>{if(st&&!i.dataset.p.endsWith('.'+st.value))return;const v=Math.max(+i.min,Math.min(+i.max,getCfg(i.dataset.p)+n*b.dataset.d));setCfg(i.dataset.p,v);i.value=v})};
$('rm').onchange=e=>{const i=e.target,p=i.dataset.p;if(p)i.value=getCfg(p)};
function buildCat(){const c=(k,P)=>{const t=P[k],d=DEF.tech[k];return '<div class="hc"><b style="color:'+t.col+'">'+t.n+'</b><span class="cc">AURA '+(d?d.c:DEF.eq[k])+'</span><span class="sl">'+tagH(k)+'</span>'+(d?'<span class="sl">ALC '+d.r+(d.d?' · DANO '+d.d:'')+'</span>':'')+'<span class="ds">'+t.d+'</span></div>'};
 $('cl').innerHTML='<h3>TÉCNICAS</h3><div class="cg">'+Object.keys(TECH).map(k=>c(k,TECH)).join('')+'</div><h3>EQUIPÁVEIS</h3><div class="cg">'+Object.keys(EQUIP).map(k=>c(k,EQUIP)).join('')+'</div>'}
const show=id=>{$('cat').style.display=id=='cat'?'flex':'none';$('home').style.display=id=='home'?'flex':'none';$('room').style.display=id=='room'?'flex':'none';$('online-join').style.display=id=='online-join'?'flex':'none';$('scr').style.display='flex'};

function handleNetData(d){
 if(!d||typeof d!=='object')return;
 if(d.act==='pal'){
  if(myTeam==='WHITE'&&d.P&&typeof d.P==='object')['dark','light','black','white','hi'].forEach(k=>{if(/^#[0-9a-f]{6}$/i.test(String(d.P[k]||'')))P[k]=d.P[k]});
 } else if(d.act==='start'){
  CFG=d.cfg;CFG.password='';RN=d.rn;myTeam='WHITE';isOnline=true;LOCAL=false;cleanNet();applyCfg();floor=1;
  $('end').classList.remove('on');$('scr').style.display='none';reset();$('gb').style.display='none';$('gm').classList.remove('on');
  
 } else if(d.act==='rematch'){
  rmOpp=true;if(rmSelf)doRematch();else tip('RIVAL QUER REVANCHE');
 } else if(d.act==='auth_fail'){
  if(d.need&&joinTarget){const t=joinTarget;leaveOnline();joinRoom(t,true);return}
  showModal('SENHA INCORRETA','A senha da sala não confere.').then(()=>{leaveOnline();show('online-join');fetchRooms()});
 } else if(d.act==='full'){
  showModal('SALA CHEIA','Essa sala já tem dois jogadores.').then(()=>{leaveOnline();show('online-join');fetchRooms()});
 } else if(d.act==='pm'||d.act==='cast'||d.act==='equip'||d.act==='kJump'){
  netQ.push(d);netPump();
 }
}

 const n=$('rname');if(n)RN=n.value.trim();
 applyCfg();floor=1;$('end').classList.remove('on');$('scr').style.display='none';reset();
 tip((RN?'Sala: '+RN+' · ':'')+(CL()?'REGRAS CLÁSSICAS':'REGRAS DE DANO')+(LOCAL?' · 2 JOGADORES':''))

// ===== ONLINE =====
// Diretório de salas sem servidor próprio: quem abre o jogo primeiro vira o "hub" (peer com ID fixo)
// e guarda a lista; os demais se conectam nele para publicar/listar salas. Se o hub sair, outro assume.
const RoomDir={
 LID:'geekchess-lobby-v1',p:null,hub:false,link:null,rooms:{},mine:{},pend:null,waiter:null,
 ok(r){return !!r&&typeof r==='object'&&typeof r.id==='string'&&/^geekchess-[a-z0-9]{4,12}$/.test(r.id)},
 clean(r){return{id:r.id,name:String(r.name||'SALA').slice(0,24),mode:r.mode=='dano'?'dano':'classico',priv:r.priv?1:0}},
 reset(){const p=this.p;this.p=null;this.hub=false;this.link=null;this.rooms={};if(p){try{p.destroy()}catch(e){}}},
 fresh(){const n=Date.now();Object.keys(this.rooms).forEach(k=>{if(n-this.rooms[k].t>15000)delete this.rooms[k]});return Object.values(this.rooms).map(r=>this.clean(r))},
 serve(c){
  const own=new Set();
  c.on('data',d=>{
   if(!d||typeof d!=='object')return;
   if(d.act==='pub'&&this.ok(d.room)){const r=this.clean(d.room);own.add(r.id);this.rooms[r.id]=Object.assign(r,{t:Date.now()})}
   else if(d.act==='rm'&&own.has(d.id)){own.delete(d.id);delete this.rooms[d.id]}
   else if(d.act==='list'){try{c.send({act:'rooms',rooms:this.fresh()})}catch(e){}}
  });
  const drop=()=>own.forEach(id=>delete this.rooms[id]);
  c.on('close',drop);c.on('error',drop);
 },
 ensure(){
  if(this.hub&&this.p&&!this.p.destroyed)return Promise.resolve(true);
  if(this.link&&this.link.open)return Promise.resolve(true);
  if(this.pend)return this.pend;
  return this.pend=new Promise(res=>{
   this.reset();
   let done=false,to=0;
   const fin=v=>{if(done)return;done=true;clearTimeout(to);this.pend=null;res(v)};
   if(typeof Peer==='undefined')return fin(false);
   to=setTimeout(()=>{this.reset();fin(false)},9000);
   const asClient=()=>{
    let p;try{p=new Peer()}catch(e){return fin(false)}
    this.p=p;this.hub=false;
    p.on('open',()=>{
     if(this.p!==p)return;
     const c=p.connect(this.LID,{reliable:true});
     c.on('open',()=>{if(this.p!==p)return;this.link=c;c.on('data',d=>this.onLink(d));fin(true)});
     const gone=()=>{if(this.link===c)this.link=null};
     c.on('close',gone);c.on('error',gone);
    });
    p.on('error',()=>{if(this.p!==p)return;this.reset();fin(false)});
   };
   let h;try{h=new Peer(this.LID)}catch(e){return fin(false)}
   this.p=h;
   h.on('connection',c=>{if(this.p===h&&this.hub)this.serve(c)});
   h.on('open',()=>{if(this.p!==h)return;this.hub=true;fin(true)});
   h.on('disconnected',()=>{if(this.p===h&&!h.destroyed){try{h.reconnect()}catch(e){}}});
   h.on('error',e=>{
    if(this.p!==h)return;
    if(e.type==='unavailable-id'){this.p=null;try{h.destroy()}catch(_){}asClient()}
    else{this.reset();fin(false)}
   });
  });
 },
 push(id){
  const r=this.mine[id];if(!r)return;
  if(this.hub)this.rooms[id]=Object.assign({},r,{t:Date.now()});
  else if(this.link&&this.link.open){try{this.link.send({act:'pub',room:r})}catch(e){}}
 },
 async publish(r){this.mine[r.id]=this.clean(r);if(await this.ensure())this.push(r.id)},
 async remove(id){delete this.mine[id];if(this.hub)delete this.rooms[id];else if(this.link&&this.link.open){try{this.link.send({act:'rm',id})}catch(e){}}},
 onLink(d){if(d&&d.act==='rooms'&&Array.isArray(d.rooms)&&this.waiter){const w=this.waiter;this.waiter=null;w(d.rooms.filter(r=>this.ok(r)).map(r=>this.clean(r)))}},
 async list(){
  if(!(await this.ensure()))return null;
  if(this.hub)return this.fresh();
  const c=this.link;if(!c)return null;
  return new Promise(res=>{
   const t=setTimeout(()=>{this.waiter=null;res(null)},4000);
   this.waiter=r=>{clearTimeout(t);res(r)};
   try{c.send({act:'list'})}catch(e){clearTimeout(t);this.waiter=null;res(null)}
  });
 }
};
let rmSelf=false,rmOpp=false,netRun=false,roomHb=null,myRoomId=null;const netQ=[];
function cleanNet(){netQ.length=0;rmSelf=false;rmOpp=false}
function closeRoomListing(){clearInterval(roomHb);roomHb=null;if(myRoomId){RoomDir.remove(myRoomId);myRoomId=null}}
function leaveOnline(){const c=conn,pr=peer;conn=null;peer=null;isOnline=false;cleanNet();closeRoomListing();rcHide();$('gb').style.display='';if(c){try{c.close()}catch(e){}}if(pr){try{pr.destroy()}catch(e){}}}
addEventListener('beforeunload',closeRoomListing);
function requestRematch(){if(rmSelf)return;rmSelf=true;sendNet({act:'rematch'});$('eb').textContent='AGUARDANDO RIVAL...';if(rmOpp)doRematch()}
function doRematch(){cleanNet();floor=1;$('end').classList.remove('on');reset()}
function peerGone(c){
 if(c!==conn||!isOnline)return;
 conn=null;over=true;busy=true;closePop();netQ.length=0;$('end').classList.remove('on');
 showModal('RIVAL DESCONECTOU','Seu adversário saiu da partida.').then(()=>{leaveOnline();show('home')});
}
function bindConn(c){c.on('data',handleNetData);c.on('close',()=>peerGone(c));c.on('error',()=>peerGone(c))}
async function netPump(){
 if(netRun)return;netRun=true;
 try{
  while(netQ.length){
   const d=netQ.shift();
   if(over){netQ.length=0;break}
   let w=0;while(busy&&!over&&w<130){await sleep(60);w++}
   const q=B[d.py]&&B[d.py][d.px];if(!q)continue;
   if(d.act==='pm')await pm(q,{x:d.mx,y:d.my},true);
   else if(d.act==='cast')await cast(d.k,q,(d.tx!==null&&d.ty!==null)?{x:d.tx,y:d.ty}:null,true);
   else if(d.act==='equip')await equip(d.k,q,true);
   else if(d.act==='kJump')await kJump(q,{x:d.mx,y:d.my},true);
  }
 }catch(e){console.error(e)}
 netRun=false;
}

// Criar sala (anfitrião): pública fica aberta, privada pede senha
const CODE_AL='abcdefghjkmnpqrstuvwxyz23456789';
const genCode=()=>Array.from({length:5},()=>CODE_AL[Math.random()*CODE_AL.length|0]).join('');
const shareLink=c=>location.href.split(/[?#]/)[0]+'?sala='+c;
function rcShow(code,priv){$('rcc').textContent=code.toUpperCase();$('rc').dataset.c=code;$('rck').style.display=priv?'':'none';$('rcb').style.display=priv?'':'none';$('rc').style.display='flex'}
function rcHide(){$('rc').style.display='none'}
$('rcb').onclick=async()=>{const l=shareLink($('rc').dataset.c||'');try{await navigator.clipboard.writeText(l);tip('LINK COPIADO!')}catch(e){showModal('LINK DA SALA',l)}};
function needPeer(){if(typeof Peer==='undefined'){showModal('SEM CONEXÃO','Não foi possível carregar a biblioteca online (PeerJS). Verifique sua internet e recarregue a página.');return false}return true}
$('b3').onclick=()=>{
 if(!needPeer())return;
 const n=$('rname');if(n)RN=n.value.trim();
 const pw=CFG.isPrivate?($('rpass')?$('rpass').value:(CFG.password||'')).trim():'';
 if(CFG.isPrivate&&pw.length<3){showModal('SENHA OBRIGATÓRIA','Defina uma senha de pelo menos 3 caracteres para a sala privada.');return}
 CFG.password=pw;applyCfg();
 leaveOnline();
 isOnline=true;myTeam='BLACK';LOCAL=false;
 const code=genCode(),id='geekchess-'+code;
 const me=new Peer(id);peer=me;
 const info={id,name:RN||'SALA DE XADREZ',mode:CFG.mode=='dano'?'dano':'classico',priv:CFG.isPrivate?1:0};
 me.on('open',()=>{
  if(peer!==me)return;
  myRoomId=id;RoomDir.publish(info);roomHb=setInterval(()=>RoomDir.publish(info),5000);
  floor=1;$('end').classList.remove('on');$('scr').style.display='none';reset();busy=true;rcShow(code,CFG.isPrivate);
  if(CFG.isPrivate)showModal('SALA PRIVADA','Código da sala: '+code.toUpperCase()+'\nSenha: '+pw+'\n\nPasse o código (ou toque em COPIAR LINK) e a senha para seu rival. O jogo começa quando ele entrar.');
 });
 me.on('connection',c=>{
  if(peer!==me)return;
  let authed=false;
  c.on('data',d=>{
   if(!d||typeof d!=='object')return;
   if(!authed){
    if(d.act!=='hello')return;
    if(CFG.isPrivate&&String(d.pass||'')!==CFG.password){try{c.send({act:'auth_fail',need:!String(d.pass||'')})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400);return}
    if(conn&&conn.open){try{c.send({act:'full'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400);return}
    authed=true;conn=c;closeRoomListing();rcHide();
    sendNet({act:'start',cfg:Object.assign({},CFG,{password:''}),rn:RN});palSend();
    cleanNet();floor=1;$('end').classList.remove('on');reset();
    
    return;
   }
   handleNetData(d);
  });
  c.on('close',()=>peerGone(c));c.on('error',()=>peerGone(c));
 });
 me.on('disconnected',()=>{if(peer===me&&!me.destroyed){try{me.reconnect()}catch(e){}}});
 me.on('error',err=>{
  if(peer!==me)return;
  if(err.type==='unavailable-id'){leaveOnline();showModal('ERRO','Não foi possível criar a sala. Tente de novo.')}
  else if(err.type!=='peer-unavailable'){showModal('ERRO DE CONEXÃO','Não foi possível manter a sala ('+err.type+').')}
 });
};

// Lista de salas e entrada
let fetching=false,joinTarget=null;
async function fetchRooms(){
 if(fetching)return;fetching=true;
 const list=$('online-list');
 if(!list.children.length)list.innerHTML='<div class="hint">Procurando salas...</div>';
 let rooms=null;try{rooms=await RoomDir.list()}catch(e){}
 fetching=false;
 list.innerHTML='';
 if(rooms===null){list.innerHTML='<div class="hint">Não foi possível carregar a lista de salas.<br>Entre com o código da sala acima.</div>';return}
 if(!rooms.length){list.innerHTML='<div class="hint">Nenhuma sala aberta no momento.<br>Crie a sua!</div>';return}
 rooms.forEach(r=>{
  const it=document.createElement('div');it.className='room-card';
  it.innerHTML='<div><b style="color:var(--mag)">'+esc(r.name||'SALA')+'</b><br><span style="font-size:7px;color:var(--dl)">'+(r.mode=='dano'?'REGRAS DE DANO':'REGRAS CLÁSSICAS')+'</span></div><div><span style="font-size:7px;color:var(--cream)">'+(r.priv?'🔒 PRIVADA':'🌐 PÚBLICA')+'</span></div>';
  it.onclick=()=>joinRoom(r.id,r.priv);
  list.append(it);
 });
}
async function joinRoom(id,priv){
 if(!needPeer())return;
 let pw='';
 if(priv){pw=await showModal('SALA PRIVADA','Digite a senha da sala:',true);if(pw===null||pw===undefined)return;pw=String(pw).trim()}
 leaveOnline();joinTarget=id;
 const me=new Peer();peer=me;let ok=false;
 const fail=(t,b)=>{if(peer!==me)return;leaveOnline();showModal(t,b).then(fetchRooms)};
 const to=setTimeout(()=>{if(!ok)fail('SEM RESPOSTA','Não foi possível conectar à sala. Tente de novo.')},12000);
 me.on('open',()=>{
  if(peer!==me)return;
  const c=me.connect(id,{reliable:true});conn=c;bindConn(c);
  c.on('open',()=>{ok=true;clearTimeout(to);tip('CONECTANDO À SALA...');c.send({act:'hello',pass:pw})});
 });
 me.on('error',err=>{
  clearTimeout(to);
  if(err.type==='peer-unavailable')fail('SALA INDISPONÍVEL','Código inválido ou a sala não está mais aberta.');
  else fail('ERRO DE CONEXÃO','Não foi possível conectar ('+err.type+').');
 });
}
const goCode=()=>{const c=$('jcode').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(c.length<4){showModal('CÓDIGO','Digite o código da sala (5 letras ou números).');return}joinRoom('geekchess-'+c)};
$('b-connect').onclick=()=>{show('online-join');fetchRooms()};
$('btn-back-join').onclick=()=>show('home');
$('btn-refresh').onclick=fetchRooms;
$('btn-code').onclick=goCode;$('jcode').onkeydown=e=>{if(e.key==='Enter')goCode()};

$('sd').onclick=$('b-snd').onclick=()=>{SFX.toggle();sndUI()};sndUI();
applyCfg();reset();show('home');requestAnimationFrame(draw);
